name: pytest

on: [push]

jobs:

  lint_types:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the whole project
        run: make install

      - name: Run linter
        run: make lint

      - name: Run typechecker
        run: make types


  test_mocked:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --extra test

      - name: Run mocked tests
        run: make test_mocked

  test_real:
    runs-on: ubuntu-latest
    needs: test_mocked
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --extra test

      - name: Setup BTRFS and ZFS for testing
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y btrfs-progs zfsutils-linux skopeo snapper
          
          # Setup BTRFS
          truncate -s 2G /tmp/btrfs-test.img
          mkfs.btrfs /tmp/btrfs-test.img
          mkdir -p /tmp/btrfs_mount
          sudo mount -t btrfs -o loop /tmp/btrfs-test.img /tmp/btrfs_mount
          
          # Configure Snapper for BTRFS
          sudo snapper -c envconf create-config /tmp/btrfs_mount
          sudo snapper -c envconf set-config ALLOW_USERS=runner SYNC_ACL=yes
          sudo setfacl -m u:runner:rwx /tmp/btrfs_mount/.snapshots
          
          # Setup ZFS
          truncate -s 2G /tmp/zfs-test.img
          sudo zpool create testpool /tmp/zfs-test.img
          sudo zfs allow runner snapshot,mount testpool
          sudo chmod a+rwx /testpool

      - name: Verify Environment and Filesystems
        run: |
          echo "=== Tool Versions ==="
          btrfs --version
          zfs --version
          skopeo --version
          echo "=== BTRFS Information ==="
          sudo btrfs filesystem show /tmp/btrfs_mount
          echo "=== ZFS Information ==="
          sudo zpool status testpool
          sudo zfs list testpool

      - name: Run real tests
        run: make test_real
